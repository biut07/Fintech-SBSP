<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title> Tela de Saldo </title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
	<style>
		body { font-family: 'Poppins', sans-serif; }
	</style>
</head>

<body class="flex flex-col min-h-screen bg-gray-50">

    <!-- Cabeçalho -->
    <header class="bg-white shadow-md sticky top-0 z-10">
        <nav class="container mx-auto p-4 flex justify-between items-center">
            <span class="font-bold text-xl text-emerald-600">Serviço de Benefício Social Privado</span>
            <a href="home.html" class="text-gray-600 hover:text-emerald-600 font-medium">Voltar</a>
        </nav>
    </header>

    <!-- Corpo -->
    <main class="flex-grow flex items-center justify-center p-4">

        <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md mx-auto">

            <h2 class="text-3xl font-bold text-center text-gray-800 mb-4">Saldo</h2>

            <!-- Caixa do saldo igual ao modelo antigo -->
            <div class="text-center bg-gray-100 p-6 rounded-lg my-6">
                <p class="text-lg text-gray-600 mb-2">Saldo disponível em conta</p>

                <span id="saldoValor" class="text-5xl font-bold text-emerald-600">
                    R$ 0,00
                </span>

                <p id="msg" class="text-sm mt-3"></p>
            </div>

        </div>
    </main>

    <script>
        const API = "http://localhost:8080/api";
        const clienteId = localStorage.getItem("clienteId");

        async function carregarSaldo() {
            const msg = document.getElementById("msg");
            const saldoValor = document.getElementById("saldoValor");

            if (!clienteId) {
                msg.textContent = "Usuário não identificado. Faça login novamente.";
                msg.className = "text-red-600 text-sm mt-2";
                return;
            }

            msg.textContent = "Carregando saldo...";
            msg.className = "text-neutral-500 text-sm mt-2";

            try {
                const resp = await fetch(`${API}/saldo/${clienteId}`);
                if (!resp.ok) throw new Error("Erro ao consultar saldo.");

                const saldo = await resp.json();

                saldoValor.textContent = Number(saldo).toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL"
                });

                msg.textContent = "Saldo atualizado ✔";
                msg.className = "text-emerald-600 text-sm mt-2";

            } catch (e) {
                msg.textContent = "Erro ao carregar saldo.";
                msg.className = "text-red-600 text-sm mt-2";
                console.error(e);
            }
        }

        document.addEventListener("DOMContentLoaded", carregarSaldo);
    </script>

</body>
</html>
