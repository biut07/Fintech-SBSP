<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tela de Pagamento</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
	<style>
		body { font-family: 'Poppins', sans-serif;}
	</style>
</head>

<body class="flex flex-col min-h-screen bg-gray-50">
    <!-- Cabeçalho -->
    <header class="bg-white shadow-md sticky top-0 z-10">
        <nav class="container mx-auto p-4 flex justify-between items-center">
            <span class="font-bold text-xl text-emerald-600">
                Serviço de Benefício Social Privado
            </span>

            <a href="plano.html"
               class="px-4 py-2 rounded-lg text-sm font-medium text-gray-700 border border-gray-300 hover:bg-gray-100 transition">
                Voltar
            </a>
        </nav>
    </header>

    <!-- Conteúdo -->
    <main class="container mx-auto px-4 py-8 flex-1 flex items-center justify-center">
        <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-lg">

            <h1 class="text-2xl font-bold mb-4 text-gray-800 text-center">
                Formas de Pagamento
            </h1>

            <p class="text-sm text-gray-600 mb-6 text-center">
                Selecione a forma de pagamento que será utilizada no seu plano.
            </p>

            <!-- Formulário -->
            <form class="space-y-6" action="home.html" id="form-pagamento">
                <div>
                    <label class="block font-medium text-gray-700 mb-2">
                        Qual a forma de pagamento?
                    </label>

                    <div class="space-y-3">
                        <label class="flex items-center justify-between border rounded-lg px-3 py-2 hover:bg-gray-50 cursor-pointer">
                            <div class="flex items-center">
                                <input type="radio" name="pagamento" value="cc"
                                       class="rounded-full text-emerald-600 focus:ring-emerald-500" required>
                                <span class="ml-2 text-sm text-gray-800">Cartão de Crédito</span>
                            </div>
                            <span class="text-xs text-gray-500">Pagamento recorrente</span>
                        </label>

                        <label class="flex items-center justify-between border rounded-lg px-3 py-2 hover:bg-gray-50 cursor-pointer">
                            <div class="flex items-center">
                                <input type="radio" name="pagamento" value="cd"
                                       class="rounded-full text-emerald-600 focus:ring-emerald-500" required>
                                <span class="ml-2 text-sm text-gray-800">Cartão de Débito</span>
                            </div>
                            <span class="text-xs text-gray-500">Débito direto na conta</span>
                        </label>

                        <label class="flex items-center justify-between border rounded-lg px-3 py-2 hover:bg-gray-50 cursor-pointer">
                            <div class="flex items-center">
                                <input type="radio" name="pagamento" value="pa"
                                       class="rounded-full text-emerald-600 focus:ring-emerald-500" required>
                                <span class="ml-2 text-sm text-gray-800">Pix Automático</span>
                            </div>
                            <span class="text-xs text-gray-500">Pix agendado mensalmente</span>
                        </label>

                        <label class="flex items-center justify-between border rounded-lg px-3 py-2 hover:bg-gray-50 cursor-pointer">
                            <div class="flex items-center">
                                <input type="radio" name="pagamento" value="boleto"
                                       class="rounded-full text-emerald-600 focus:ring-emerald-500" required>
                                <span class="ml-2 text-sm text-gray-800">Boleto</span>
                            </div>
                            <span class="text-xs text-gray-500">Boleto enviado todo mês</span>
                        </label>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-emerald-500 text-white font-medium py-3 rounded-lg hover:bg-emerald-600 transition">
                    Concluir
                </button>

                <!-- Mensagem de feedback -->
                <p id="mensagemPagamento" class="text-center mt-4 text-sm hidden"></p>
            </form>
        </div>
    </main>

    <script>
        const API_BASE    = "http://localhost:8080/api";
        const API_COMPRAS = `${API_BASE}/compras`;

        const formPagamento = document.getElementById("form-pagamento");
        const msgPagamento  = document.getElementById("mensagemPagamento");

        function mostrarMensagemPagamento(texto, tipo = "ok") {
            msgPagamento.textContent = texto;
            msgPagamento.className =
                "text-center mt-4 text-sm " +
                (tipo === "ok" ? "text-emerald-600" : "text-red-600");
            msgPagamento.classList.remove("hidden");
        }

        async function registrarCompraPlano(formaPagamento, nomeMetodo) {
            const clienteId = localStorage.getItem("clienteId");
            if (!clienteId) {
                mostrarMensagemPagamento("Nenhum usuário logado. Faça login novamente.", "erro");
                return false;
            }

            const valorPlano = 199.90;

            // 🔎 Verifica saldo antes de registrar
            try {
                const respSaldo = await fetch(`${API_BASE}/saldo/${clienteId}`);
                if (!respSaldo.ok) throw new Error("Erro ao consultar saldo.");

                const saldo = await respSaldo.json();
                if (Number(saldo) < valorPlano) {
                    mostrarMensagemPagamento("Saldo insuficiente para pagar o plano.", "erro");
                    return false;
                }
            } catch (e) {
                console.error(e);
                mostrarMensagemPagamento("Erro ao verificar saldo. Tente novamente.", "erro");
                return false;
            }

            // 💾 Registra a transação do plano
            try {
                const resp = await fetch(API_COMPRAS, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        clienteId: clienteId,
                        valor: valorPlano,
                        formaPagamento: formaPagamento,
                        descricao: `Pagamento do plano (${nomeMetodo})`
                    })
                });

                if (!resp.ok) {
                    throw new Error("Erro ao registrar pagamento do plano: " + resp.status);
                }
                return true;
            } catch (e) {
                console.error(e);
                mostrarMensagemPagamento("Erro ao registrar pagamento do plano.", "erro");
                return false;
            }
        }

        formPagamento.addEventListener("submit", async function (event) {
            event.preventDefault();

            const selecionado = formPagamento.querySelector('input[name="pagamento"]:checked');
            if (!selecionado) return;

            let nomeMetodo = "";
            let formaBackend = "";

            switch (selecionado.value) {
                case "cc":
                    nomeMetodo   = "Cartão de Crédito";
                    formaBackend = "CARTAO_CREDITO";
                    break;
                case "cd":
                    nomeMetodo   = "Cartão de Débito";
                    formaBackend = "CARTAO_DEBITO";
                    break;
                case "pa":
                    nomeMetodo   = "Pix Automático";
                    formaBackend = "PIX_AUTOMATICO";
                    break;
                case "boleto":
                    nomeMetodo   = "Boleto";
                    formaBackend = "BOLETO";
                    break;
            }

            const ok = await registrarCompraPlano(formaBackend, nomeMetodo);
            if (!ok) return;

            mostrarMensagemPagamento(
                `Forma de pagamento selecionada: ${nomeMetodo}. Voltando ao menu...`,
                "ok"
            );

            setTimeout(() => {
                window.location.href = "home.html";
            }, 4000);
        });
    </script>

</body>
</html>
