<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Extrato</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-neutral-100">

  <!-- NAVBAR -->
  <header class="bg-white shadow-md sticky top-0 z-10">
        <nav class="container mx-auto p-4 flex justify-between items-center">
            <span class="font-bold text-xl text-emerald-600">Serviço de Benefício Social Privado</span>

            <a href="home.html" 
                class="px-4 py-2 rounded-lg text-sm font-medium text-gray-700 border border-gray-300 hover:bg-gray-100 transition">
                Voltar
            </a>
        </nav>
    </header>

  <div class="min-h-screen flex items-start justify-center py-4">
    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.08)] p-8 mt-2">

      <!-- Cabeçalho + botão -->
      <div class="flex flex-col gap-4 mb-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-2xl font-extrabold tracking-tight">Histórico de Transações</h2>
            <p class="text-neutral-500 mt-1">
              Exibição por tipo de pagamento, valor, forma e data.
            </p>
          </div>

          <button id="btnAtualizar"
                  type="button"
                  class="rounded-xl px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold shadow">
            Atualizar
          </button>
        </div>

        <!-- Mensagem de status -->
        <p id="msg" class="text-sm text-neutral-500"></p>
      </div>

      <!-- Tabela -->
      <div class="overflow-x-auto rounded-2xl border border-neutral-200">
        <table class="min-w-full text-left text-sm">
          <thead class="bg-neutral-50 border-b border-neutral-200">
            <tr>
              <th class="px-4 py-3 font-semibold text-neutral-700">Tipo de Pagamento</th>
              <th class="px-4 py-3 font-semibold text-neutral-700">Valor</th>
              <th class="px-4 py-3 font-semibold text-neutral-700">Forma de Pagamento</th>
              <th class="px-4 py-3 font-semibold text-neutral-700">Data</th>
            </tr>
          </thead>
          <tbody id="listaExtrato" class="divide-y divide-neutral-100">
            <!-- linhas criadas via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_BASE      = "http://localhost:8080/api";
    const API_COMPRAS   = `${API_BASE}/compras`;

    const msgEl         = document.getElementById("msg");
    const btnAtualizar  = document.getElementById("btnAtualizar");
    const corpoTabela   = document.getElementById("listaExtrato");

    function limparTabela() {
      corpoTabela.innerHTML = "";
    }

    function formatarValor(valor) {
      return Number(valor).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function formatarData(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString("pt-BR");
    }

    function formatarTipo(forma) {
      switch (forma) {
        case "PIX_ENVIO": return "PIX enviado";
        case "PIX_RECEBIDO": return "PIX recebido";
        case "COFRE_APLICACAO": return "Aplicação no Cofre";
        case "COFRE_RESGATE": return "Resgate do Cofre";
        case "PLANO_PAGAMENTO": return "Pagamento de Plano";
        default: return "Transação";
      }
    }

    async function carregarExtrato() {
      const clienteId = localStorage.getItem("clienteId");

      msgEl.textContent = "Carregando...";
      msgEl.className   = "text-sm text-neutral-500";

      btnAtualizar.disabled = true;
      btnAtualizar.classList.add("opacity-60");

      limparTabela();

      if (!clienteId) {
        msgEl.textContent = "Nenhum usuário logado.";
        msgEl.className = "text-red-600";
        return;
      }

      try {
        const resp = await fetch(`${API_COMPRAS}?clienteId=${clienteId}`);
        if (!resp.ok) throw new Error("Erro ao carregar compras");

        const lista = await resp.json();

        if (lista.length === 0) {
          msgEl.textContent = "Nenhuma transação encontrada.";
          msgEl.className = "text-neutral-500";
          return;
        }

        lista.forEach(c => {
          const tr = document.createElement("tr");
          tr.className = "hover:bg-neutral-50";

          const tipo = formatarTipo(c.formaPagamento);

          tr.innerHTML = `
            <td class="px-4 py-3">${tipo}</td>
            <td class="px-4 py-3 font-semibold text-emerald-600">${formatarValor(c.valor)}</td>
            <td class="px-4 py-3">${c.formaPagamento}</td>
            <td class="px-4 py-3">${formatarData(c.data)}</td>
          `;

          corpoTabela.appendChild(tr);
        });

        msgEl.textContent = `Total de transações: ${lista.length}`;
        msgEl.className = "text-emerald-600";

      } catch (e) {
        console.error(e);
        msgEl.textContent = "Erro ao carregar extrato.";
        msgEl.className = "text-red-600";
      } finally {
        btnAtualizar.disabled = false;
        btnAtualizar.classList.remove("opacity-60");
      }
    }

    btnAtualizar.addEventListener("click", carregarExtrato);
    document.addEventListener("DOMContentLoaded", carregarExtrato);
  </script>

</body>
</html>
