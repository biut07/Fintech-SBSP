<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Compras (API)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-neutral-100">
  <div class="min-h-screen flex items-center justify-center py-10">
    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.08)] p-8">
      <!-- Cabeçalho -->
      <div class="flex flex-col gap-4 mb-6">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h1 class="text-3xl font-extrabold tracking-tight">Compras registradas</h1>
            <p class="text-neutral-500 mt-1">Dados vindos do microserviço de compras.</p>
          </div>
          <div class="flex gap-2 justify-end">
            <button id="btnAtualizar"
                    class="rounded-xl px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-semibold shadow">
              Atualizar
            </button>
          </div>
        </div>

        <!-- Filtro por ID de cliente (opcional) -->
        <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center">
          <label class="text-sm text-neutral-700">
            Filtrar por ID do cliente (opcional)
          </label>
          <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
            <input id="filtroClienteId"
                   type="text"
                   placeholder="Cole aqui o ID do cliente (ou deixe vazio)"
                   class="w-full sm:w-96 px-3 py-2 rounded-xl border border-neutral-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500" />
          </div>
        </div>
      </div>

      <!-- Mensagem de status -->
      <p id="msg" class="text-sm text-neutral-500 mb-3"></p>

      <!-- Tabela -->
      <div class="overflow-x-auto rounded-2xl border border-neutral-200">
        <table class="min-w-full text-left text-sm">
          <thead class="bg-neutral-50 border-b border-neutral-200">
            <tr>
              <th class="px-4 py-3 font-semibold text-neutral-700">ID</th>
              <th class="px-4 py-3 font-semibold text-neutral-700">Cliente ID</th>
              <th class="px-4 py-3 font-semibold text-neutral-700">Valor</th>
              <th class="px-4 py-3 font-semibold text-neutral-700">Forma de pagamento</th>
              <th class="px-4 py-3 font-semibold text-neutral-700">Data</th>
            </tr>
          </thead>
          <tbody id="listaCompras" class="divide-y divide-neutral-100">
            <!-- linhas criadas via JS -->
          </tbody>
        </table>
      </div>

      <!-- link pra voltar -->
      <div class="mt-4 text-right">
        <a href="home.html"
           class="inline-block text-sm text-sky-600 hover:text-sky-700 font-medium">
          ◀ Voltar para Home
        </a>
      </div>
    </div>
  </div>

  <script>
    const API_COMPRAS = "http://localhost:8080/api/compras";

    function limparTabela() {
      const corpo = document.getElementById("listaCompras");
      while (corpo.firstChild) corpo.removeChild(corpo.firstChild);
    }

    function formatarValor(valor) {
      if (valor == null) return "";
      return Number(valor).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL",
      });
    }

    function formatarData(iso) {
      if (!iso) return "";
      // tenta converter a string ISO em data legível
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString("pt-BR");
    }

    async function carregarCompras() {
      const msg   = document.getElementById("msg");
      const btn   = document.getElementById("btnAtualizar");
      const corpo = document.getElementById("listaCompras");
      const filtroCliente = document.getElementById("filtroClienteId").value.trim();

      msg.textContent = "Carregando compras...";
      msg.className = "text-sm text-neutral-500 mb-3";

      btn.disabled = true;
      btn.classList.add("opacity-60", "cursor-not-allowed");

      limparTabela();

      try {
        // monta URL com ou sem filtro de clienteId
        const url = filtroCliente
          ? `${API_COMPRAS}?clienteId=${encodeURIComponent(filtroCliente)}`
          : API_COMPRAS;

        const resp = await fetch(url);
        if (!resp.ok) throw new Error("Erro ao buscar compras: " + resp.status);
        const dados = await resp.json();

        if (!dados || dados.length === 0) {
          msg.textContent = "Nenhuma compra encontrada.";
          msg.className = "text-sm text-neutral-500 mb-3";
          return;
        }

        dados.forEach(c => {
          const tr = document.createElement("tr");
          tr.className = "hover:bg-neutral-50";

          const tdId     = document.createElement("td");
          const tdCliId  = document.createElement("td");
          const tdValor  = document.createElement("td");
          const tdForma  = document.createElement("td");
          const tdData   = document.createElement("td");

          tdId.className    = "px-4 py-3 text-xs text-neutral-500 max-w-[160px] break-words";
          tdCliId.className = "px-4 py-3 text-xs text-neutral-500 max-w-[160px] break-words";
          tdValor.className = "px-4 py-3 text-sm text-neutral-800";
          tdForma.className = "px-4 py-3 text-sm text-neutral-700";
          tdData.className  = "px-4 py-3 text-sm text-neutral-700";

          tdId.textContent    = c.id || "";
          tdCliId.textContent = c.clienteId || "";
          tdValor.textContent = formatarValor(c.valor);
          tdForma.textContent = c.formaPagamento || "";
          tdData.textContent  = formatarData(c.data);

          tr.appendChild(tdId);
          tr.appendChild(tdCliId);
          tr.appendChild(tdValor);
          tr.appendChild(tdForma);
          tr.appendChild(tdData);

          corpo.appendChild(tr);
        });

        msg.textContent = `Total de compras: ${dados.length}`;
        msg.className = "text-sm text-emerald-600 mb-3";
      } catch (err) {
        console.error(err);
        msg.textContent = "Erro ao carregar compras. Verifique se a API (porta 8080) está rodando.";
        msg.className = "text-sm text-red-600 mb-3";
      } finally {
        btn.disabled = false;
        btn.classList.remove("opacity-60", "cursor-not-allowed");
      }
    }

    document.getElementById("btnAtualizar").addEventListener("click", carregarCompras);
    // carrega automaticamente ao abrir a página
    document.addEventListener("DOMContentLoaded", carregarCompras);
  </script>
</body>
</html>
