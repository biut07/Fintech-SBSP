<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tela de Cofre</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="flex flex-col min-h-screen bg-gray-50">
  <!-- Cabeçalho -->
  <header class="bg-white shadow-md sticky top-0 z-10">
    <nav class="container mx-auto p-4 flex justify-between items-center">
      <span class="font-bold text-xl text-emerald-600">
        Serviço de Benefício Social Privado
      </span>

      <div>
        <a href="home.html" 
           class="px-4 py-2 rounded-lg text-sm font-medium text-gray-700 border border-gray-300 hover:bg-gray-100 transition">
          Voltar
        </a>
      </div>
    </nav>
  </header>

  <!-- Conteúdo -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-md mx-auto">
      <h2 class="text-3xl font-bold text-center text-gray-800 mb-4">Cofre</h2>

      <!-- Caixa do saldo -->
      <div class="text-center bg-gray-100 p-6 rounded-lg my-6">
        <p class="text-lg text-gray-600 mb-1">Valor da operação</p>
        <p class="text-xs text-gray-400 mb-2">
          Clique no valor em verde para editar.
        </p>

        <!-- R$ fixo + parte numérica editável -->
        <div class="select-none text-5xl font-bold text-emerald-600">
          R$
          <span
            id="saldoValor"
            contenteditable="true"
            class="inline-block px-1 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-400"
          >
            0,00
          </span>
        </div>
      </div>

      <!-- Botões -->
      <button
        id="btnAplicar"
        class="w-full py-2 rounded-lg bg-emerald-500 hover:bg-emerald-600 
               text-white font-semibold text-sm transition"
      >
        Aplicar no Cofre
      </button>

      <button
        id="btnResgatar"
        class="w-full py-2 rounded-lg bg-emerald-500 hover:bg-emerald-600 
               text-white font-semibold text-sm mt-3 transition"
      >
        Resgatar do Cofre
      </button>

      <!-- Mensagem -->
      <p id="mensagem" class="mt-4 text-center text-sm"></p>
    </div>
  </main>

  <script>
    const API_BASE    = "http://localhost:8080/api";
    const API_COMPRAS = `${API_BASE}/compras`;

    const saldoValor  = document.getElementById("saldoValor");
    const msg         = document.getElementById("mensagem");
    const btnAplicar  = document.getElementById("btnAplicar");
    const btnResgatar = document.getElementById("btnResgatar");

    function mostrarMensagem(texto, tipo) {
      msg.textContent = texto;
      msg.className =
        "mt-4 text-center text-sm " +
        (tipo === "ok" ? "text-emerald-600" : "text-red-600");
    }

    function normalizarValorTexto(texto) {
      if (!texto) return "0,00";
      texto = texto.trim().replace(/\./g, "").replace(",", ".");
      const num = parseFloat(texto);
      if (isNaN(num) || num < 0) return "0,00";

      return num.toLocaleString("pt-BR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function obterValorNumerico() {
      const txt = saldoValor.innerText.trim();
      const num = parseFloat(txt.replace(/\./g, "").replace(",", "."));
      return isNaN(num) ? 0 : num;
    }

    saldoValor.addEventListener("blur", () => {
      saldoValor.innerText = normalizarValorTexto(saldoValor.innerText);
    });

    saldoValor.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        saldoValor.blur();
        return;
      }

      const especiais = [
        "Backspace", "Delete", "ArrowLeft", "ArrowRight",
        "ArrowUp", "ArrowDown", "Tab", "Home", "End"
      ];
      if (especiais.includes(e.key)) return;

      if (!/^[0-9]$/.test(e.key)) e.preventDefault();
    });

    async function registrarCompraCofre(valor, operacao) {
      const clienteId = localStorage.getItem("clienteId");
      if (!clienteId) {
        mostrarMensagem("Nenhum usuário logado. Faça login novamente.", "erro");
        return false;
      }

      // 💰 Verifica saldo SOMENTE na aplicação (saída de saldo)
      if (operacao === "COFRE_APLICACAO") {
        try {
          const respSaldo = await fetch(`${API_BASE}/saldo/${clienteId}`);
          if (!respSaldo.ok) throw new Error("Erro ao buscar saldo.");
          const saldo = await respSaldo.json();

          if (Number(saldo) < valor) {
            mostrarMensagem("Saldo insuficiente para aplicar no cofre.", "erro");
            return false;
          }
        } catch (e) {
          console.error(e);
          mostrarMensagem("Erro ao verificar saldo.", "erro");
          return false;
        }
      }

      const descricao =
        operacao === "COFRE_APLICACAO" ? "Aplicação no cofre" :
        operacao === "COFRE_RESGATE"   ? "Resgate do cofre" :
                                         "Operação no cofre";

      try {
        const resp = await fetch(API_COMPRAS, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            clienteId,
            valor,
            formaPagamento: operacao,
            descricao
          })
        });

        if (!resp.ok) throw new Error("Erro na API");
        return true;

      } catch (e) {
        console.error(e);
        mostrarMensagem("Erro ao registrar operação no cofre.", "erro");
        return false;
      }
    }

    btnAplicar.addEventListener("click", async () => {
      const valor = obterValorNumerico();
      const valorTxt = saldoValor.innerText;

      if (valor <= 0) {
        mostrarMensagem("Informe um valor válido.", "erro");
        return;
      }

      const ok = await registrarCompraCofre(valor, "COFRE_APLICACAO");
      if (!ok) return;

      mostrarMensagem(`R$ ${valorTxt} aplicado com sucesso!`, "ok");

      setTimeout(() => window.location.href = "home.html", 4000);
    });

    btnResgatar.addEventListener("click", async () => {
      const valor = obterValorNumerico();
      const valorTxt = saldoValor.innerText;

      if (valor <= 0) {
        mostrarMensagem("Informe um valor válido.", "erro");
        return;
      }

      const ok = await registrarCompraCofre(valor, "COFRE_RESGATE");
      if (!ok) return;

      mostrarMensagem(`R$ ${valorTxt} resgatado com sucesso!`, "ok");

      setTimeout(() => window.location.href = "home.html", 4000);
    });
  </script>

</body>
</html>
