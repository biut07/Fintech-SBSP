<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Tela de Cadastro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-neutral-100">
  <div class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-lg">
      <div class="text-center">
        <h1 class="text-3xl font-bold">Bem-vindo!</h1>
        <p class="text-neutral-500">Faça o cadastro para continuar.</p>
      </div>

      <!-- FORMULÁRIO -->
      <form id="cadastroForm" class="space-y-4" action="#">
        <div class="space-y-3">
          
          <label class="block text-sm" for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" required
            class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500" />

          <label class="block text-sm" for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" required
            class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500" />

          <label class="block text-sm" for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required
            class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500" />

          <label class="block text-sm" for="email">E-mail</label>
          <input type="email" id="email" name="email" required
            class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500" />

          <label class="block text-sm" for="telefone">Telefone (opcional)</label>
          <input type="text" id="telefone" name="telefone"
            class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500" />

        </div>

        <button type="submit"
          class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg py-2">
          Concluir
        </button>
      </form>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {

      const form = document.getElementById('cadastroForm');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const nome      = document.getElementById("nome").value.trim();
        const email     = document.getElementById("email").value.trim();
        const cpf       = document.getElementById("cpf").value.trim();
        const telefone  = document.getElementById("telefone").value.trim();
        const senha     = document.getElementById("senha").value.trim();

        if (!nome || !email || !cpf || !senha) {
          alert("Preencha todos os campos obrigatórios!");
          return;
        }

        try {
          const resp = await fetch("http://localhost:8080/api/clientes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              nome: nome,
              email: email,
              cpf: cpf,
              telefone: telefone,
              senha: senha  // senha pura → backend gera hash
            })
          });

          if (!resp.ok) throw new Error("Erro ao enviar dados: " + resp.status);

          const cliente = await resp.json();
          alert("Cadastro concluído! Bem-vindo (ID: " + cliente.id + ")");

          // já deixa o usuário logado
          localStorage.setItem("clienteId", cliente.id);
          localStorage.setItem("clienteNome", cliente.nome);
          localStorage.setItem("clienteCpf", cliente.cpf);

          window.location.href = "home.html";

        } catch (err) {
          console.error("[Cadastro] Erro:", err);
          alert("Erro ao cadastrar: " + err.message);
        }
      });
    });
  </script>

</body>
</html>
